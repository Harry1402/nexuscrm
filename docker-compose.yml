services:

  espocrm-db:
    image: mariadb:latest
    container_name: nexuscrm_db
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-espocrm}
      MARIADB_USER: ${MARIADB_USER:-espocrm}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    volumes:
      - espocrm_db:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 20s
      start_period: 10s
      timeout: 10s
      retries: 3

  espocrm:
    image: espocrm/espocrm:latest
    container_name: nexuscrm_espocrm
    restart: unless-stopped

    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: ${ESPOCRM_DATABASE_HOST:-espocrm-db}
      ESPOCRM_DATABASE_PORT: ${ESPOCRM_DATABASE_PORT:-3306}
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DATABASE_NAME:-espocrm}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DATABASE_USER:-espocrm}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DATABASE_PASSWORD}

      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}

      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL:-http://localhost:8080}

    depends_on:
      espocrm-db:
        condition: service_healthy

    volumes:
      - espocrm_data:/var/www/html/data
      - espocrm_custom:/var/www/html/custom
      - espocrm_custom_client:/var/www/html/client/custom

    ports:
      - "8080:80"

  espocrm-daemon:
    image: espocrm/espocrm:latest
    container_name: nexuscrm_daemon
    restart: unless-stopped

    volumes:
      - espocrm_data:/var/www/html/data
      - espocrm_custom:/var/www/html/custom
      - espocrm_custom_client:/var/www/html/client/custom

    depends_on:
      - espocrm

    entrypoint: docker-daemon.sh

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: nexuscrm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  integration-api:
    build:
      context: ./integration-api
      dockerfile: Dockerfile
    container_name: nexus-crm-integration-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ESPOCRM_SITE_URL: http://espocrm
      ESPOCRM_API_KEY: ${ESPOCRM_API_KEY:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-crm-files}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-support@nexuscrm.local}
    depends_on:
      - espocrm
      - minio

volumes:
  espocrm_db:
  espocrm_data:
  espocrm_custom:
  espocrm_custom_client:
  minio_data:

