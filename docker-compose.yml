services:

  db:
    image: mysql:8.0
    container_name: nexuscrm_db
    environment:
      MYSQL_DATABASE: espocrm
      MYSQL_USER: espocrm
      MYSQL_PASSWORD: espocrm_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  espocrm:
    image: espocrm/espocrm:latest
    container_name: nexuscrm_espocrm
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: espocrm_password

      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: admin

      ESPOCRM_SITE_URL: "http://localhost:8080"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - espocrm_data:/var/www/html

    ports:
      - "8080:80"

    restart: always

  espocrm-daemon:
    image: espocrm/espocrm:latest
    container_name: nexuscrm_daemon

    volumes:
      - espocrm_data:/var/www/html

    depends_on:
      - espocrm

    restart: always
    entrypoint: docker-daemon.sh

volumes:
  mysql_data:
  espocrm_data:
